# ==============================================================================
# ITERATION 4 CONFIG — same daily criteria as Iteration 3, on the ranges
# narrowed after it. Reuses the Iteration 3 Morris classification.
#
# ITER4 (this config). Inherits narrowed parameter ranges directly from ITER3
# via the standard daily-satisfactory subset. Same calibration metrics as
# ITER3 (NSE_day, KGE_day, PBIAS_day) — Iter 2 is pure depth: more LHS
# samples around the satisfactory region of Iter 1.
#
# Multi-scale premise: WB closure is the concern of ITER1 (annual). the daily iterations
# calibrates streamflow only. The diagnostic_balance block below produces only
# DIAGNOSTIC columns/figure on each run (not used as filter), so the
# streamflow-calibrated ensemble can be checked post-hoc against the WB
# closure of ITER1.
#
# WORKFLOW:
#   1. ITER3 (run_cal.R + config/iteration3.yaml)
#        → produces ITER3_v<N>/inherited_ranges_ITER3_v<N>.csv
#           (narrowed from the daily-satisfactory subset of ITER3)
#   2. ITER4 (run_cal.R + this config; inherit.from = "ITER3")
#        → produces ITER4_v<K>/  (the depth-refined daily ensemble)
# ==============================================================================

iteration: 4
script_version: "iteration4"

# --- Paths and execution (PRODUCTION — Cap 2 1980s window) ---
project_path: "C:/path/to/swatplus_project"   # <-- EDIT: SWAT+ project dir holding TxtInOut/
start_date: "1976-01-01"          # PRODUCTION
end_date: "1989-12-31"            # PRODUCTION
warmup: 4                         # PRODUCTION
threads: 20
seed: 123
channel_exutorio: 33

# --- Morris screening settings (not used for Iter 2; reuses Iteration 3 Morris screening result via auto-detect) ---
morris:
  tag_prefix: "MORRIS3"            # locates MORRIS3_v<N>; Iteration 4 reuses the Iteration 3 screening
  m_traj: 15                    # PRODUCTION (matches iteration3.yaml so Morris screening folder lookup is consistent)
  delta: 0.20
  start_date: "1976-01-01"          # PRODUCTION
  end_date: "1989-12-31"            # PRODUCTION
  warmup: 4                         # PRODUCTION

# --- Calibration settings (PRODUCTION) ---
# same predicate as ITER3 — daily NSE/KGE/PBIAS + RC + BFI multi-site.
# Iter 2 just refines around the narrowed prior from ITER3.
cal:
  tag_prefix: "ITER4"          # output folder pattern: ITER4_v<N>
  n_simulations: 250            # PRODUCTION
  type: "hard"
  inheritance_source: "satisfactory"  # PRODUCTION: narrow on accepted runs only
  start_date: "1976-01-01"          # PRODUCTION
  end_date: "1989-12-31"            # PRODUCTION
  warmup: 4                         # PRODUCTION

  # streamflow thresholds (PRODUCTION, daily)
  threshold_nse: 0.50           # PRODUCTION
  threshold_kge: 0.50           # PRODUCTION
  threshold_abs_pbias: 15       # PRODUCTION

  # RC + BFI predicates (must match ITER3 since this is its depth refinement)
  rc_target:           0.51853  # observed Q_total / P (1980-1989 at Iraí outlet)
  threshold_obj_rc:    0.10     # |RC_obs - RC_sim| <= 0.10
  threshold_obj_bfi:   0.10     # median(|BFI_obs - BFI_sim|) <= 0.10

# --- BFI multisite targets ---
bfi_targets_csv: "bfi_targets.csv"

# BFI runtime controls (PRODUCTION)
bfi:
  sim_source:       "swat_internal_bf"  # SWAT+ internal aquifer partition (filter source)
  multi_day_output: "vazao_multi_day"
  period_start:     "1980-01-01"
  period_end:       "1989-12-31"        # PRODUCTION; Eckhardt branch only
  min_days:         365                 # PRODUCTION; Eckhardt branch only
  eps:              0.05

# --- Diagnostic targets (DIAGNOSTIC ONLY — never combined with daily filter) -
# Same as iteration3.yaml: reports rto_et, rto_q, rto_wyld, rto_baseflow as columns
# on each calibration run + a balance_scatter_<TAG>.tif figure. NEVER combined
# with the daily NSE/KGE/PBIAS filter that defines satisfactory_run.
diagnostic_balance:
  et_rto: 0.48147
  wyld_rto: 0.51853
  threshold_pct: 15           # legacy field; unused in the daily iterations (diagnostic only)

# --- Observed data ---
obs_files:
  monthly: "obs_flow_mon.csv"
  daily: "obs_flow_daily.csv"
obs_start_date: "1980-01-01"

# --- SWAT+ outputs for Morris screening ---
morris_outputs:
  vazao_exutorio:
    file: "channel_sdmorph_day"
    variable: "flo_out"
    unit: 33

# --- SWAT+ outputs for calibration ---
# Q_total = wateryld + baseflow is used as the WB acceptance criterion
# (matches observed Q_obs/P which includes the baseflow component).
#
# Tier 1 (essential — closure correction):
#   basin_wb_aa.wateryld    = surq_gen + latq (surface + lateral, NO gw_q)
#   basin_aqu_aa.flo_cha    = aquifer flow to channel (gw_q / baseflow)
#
# Tier 2 (recommended — diagnostic; ~zero memory cost):
#   basin_wb_aa.surq_gen    = surface runoff component
#   basin_wb_aa.latq        = lateral soil flow component
#   basin_wb_aa.perc        = percolation to aquifer
#   basin_aqu_aa.{rchrg,seep,revap,stor} = aquifer dynamics
#     (lets you verify mass closure and detect aquifer drawdown)
#
# Tier 3 (optional — multi-site Morris support; +~10 MB per sim):
#   lsunit_wb_aa per-LSU      (uncomment if running multi-site analysis)
#   channel_sd_aa per-channel (uncomment if decomposing channel dissipation)
cal_outputs:
  vazao_exutorio_day:
    file: "channel_sdmorph_day"
    variable: "flo_out"
    unit: 33
  vazao_exutorio_mon:
    file: "channel_sdmorph_mon"
    variable: "flo_out"
    unit: 33
  vazao_multi_day:                  # daily Q at ALL selected gauges (Eckhardt input)
    file: "channel_sdmorph_day"
    variable: "flo_out"
    unit: [5, 19, 33, 35, 42, 73, 79, 114, 136, 146, 194]   # 9 BFI + 33 (Iraí outlet) + 35 (Foz Chapecó, ONS) for daily Q capture
  # channel-routed RC reads cha_aa_flo_out_<channel_exutorio> from
  # extra_outputs.channels (channel_sd_aa). channel_sdmorph_aa.flo_out_mm
  # is not exposed by SWATrunR's output-schema map, so we derive Q at the
  # outlet from m³/s and aquifer.con upstream-area topology.
  # ---- Tier 1: closure correction ----
  precip:
    file: "basin_wb_aa"
    variable: "precip"
    unit: 1
  et:
    file: "basin_wb_aa"
    variable: "et"
    unit: 1
  wateryld:
    file: "basin_wb_aa"
    variable: "wateryld"
    unit: 1
  baseflow:
    file: "basin_aqu_aa"
    variable: "flo_cha"
    unit: 1
  # ---- Tier 2: diagnostic decomposition (recommended) ----
  surq_gen:
    file: "basin_wb_aa"
    variable: "surq_gen"
    unit: 1
  latq:
    file: "basin_wb_aa"
    variable: "latq"
    unit: 1
  perc:
    file: "basin_wb_aa"
    variable: "perc"
    unit: 1
  aqu_rchrg:
    file: "basin_aqu_aa"
    variable: "rchrg"
    unit: 1
  aqu_seep:
    file: "basin_aqu_aa"
    variable: "seep"
    unit: 1
  aqu_revap:
    file: "basin_aqu_aa"
    variable: "revap"
    unit: 1
  aqu_stor:
    file: "basin_aqu_aa"
    variable: "stor"
    unit: 1
  # ---- Tier 3 outputs ----
  # NOTE: Per-LSU / per-HRU / per-channel / per-aquifer bulk retention is
  # configured via the `extra_outputs:` block below (mirrors the h3_outputs:
  # pattern from swatplus-calibrator). Do NOT enumerate hundreds of units here.

# ------------------------------------------------------------------------------
# extra_outputs (OPTIONAL) — bulk retention block, mirrors swatplus-calibrator's
# h3_outputs:. Generates per-channel / per-LSU / per-HRU / per-aquifer outputs
# without enumerating each unit. All sub-blocks are independently toggleable.
#
# Memory cost: ~10-50 MB extra per simulation (depends on which sub-blocks are
# enabled). Keep disabled (`enabled: false`) for fast Morris sweeps; enable
# selectively for diagnostic-heavy iterations (e.g., ITER4 BFI multi-site).
#
# Output naming in sim$simulation:
#   channels  -> cha_aa_<var>   (e.g., cha_aa_flo_out)
#   lsu       -> lsu_<var>      (e.g., lsu_precip)
#   hru       -> hru_<var>      (e.g., hru_et)
#   aquifer   -> aqu_<var>      (e.g., aqu_rchrg)
# ------------------------------------------------------------------------------
extra_outputs:
  enabled: true                   # PRODUCTION: ON — required for cha_aa_flo_out_<outlet> (channel-routed RC) + per-aquifer

  # --- channel_sd_aa per reach (channel dissipation + per-channel BFI) -------
  channels:
    enabled: true
    units: [5, 19, 33, 35, 42, 73, 79, 114, 136, 146, 194]   # 9 BFI + 33 + 35
    # cha_units_file: "data/cha_units_iraí.txt"
    vars: ["flo_in", "flo_out", "evap", "seep"]   # H_diss canonical set

  # --- lsunit_wb_aa per LSU (spatial water balance decomposition) ------------
  # REQUIRES SWATrunR rebuilt with the read_output_i guard (see calibrator
  # README "Known issues" — header has 51 cols but data has 49 in rev 61).
  # User confirmed the patch is installed.
  lsu:
    enabled: true
    n_lsu: 422                    # number of LSUs in lsunit_wb_aa.txt
    wb_vars: ["precip", "et", "wateryld",
              "surq_gen", "latq", "perc"]

  # --- hru_wb_aa per filtered HRU (per-class LULC banding) -------------------
  # IDs file ships at data/hru_ids_for_h3.txt (175 HRUs, top-25 per LULC class).
  hru:
    enabled: true
    hru_ids_file: "data/hru_ids_for_h3.txt"
    wb_vars: ["precip", "et", "surq_gen",
              "latq", "perc", "wateryld"]

  # --- aquifer_aa per aquifer (per-aquifer water balance + baseflow) ---------
  aquifer:
    enabled: true
    n_aqu: 47                     # number of aquifers in aquifer.con
    aqu_vars: ["flo", "rchrg", "seep", "revap", "flo_cha"]

# --- Morris screening metrics to compute EE ---
morris_metrics:
  - "NSE_day"
  - "KGE_day"
  - "PBIAS_day"
  - "obj_total"

# --- Temporal scale ---
temporal_scale: "daily"
metric_suffix: "_day"

# --- Inherited ranges (from ITER3 satisfactory subset) ---
# Iteration 2 re-samples LHS from the narrowed ranges produced by ITER3's
# daily-satisfactory subset (NSE_day/KGE_day/PBIAS_day filter only — no joint
# WB criterion). Pure depth refinement at the same calibration scale.
inherit:
  from: "ITER3"                # tag prefix of the source iteration (no _vN)

  # AUTO-DROP by Morris sensitivity: drops params with mu*(obj_total) <= threshold.
  # ITER4 reuses MORRIS3's ranking (no new Morris screening in Iter 2). The auto-drop is lenient
  # for params already absent from ITER3's narrowed set.
  #   - 0      : drop only literal-zero mu* (catches silent fails / SWAT+ init bugs)
  #   - 0.001  : also drop physically irrelevant params (more aggressive)
  #   - omitted/NULL : disabled (default)
  # auto_drop_threshold: 0        # PRODUCTION default = disabled.
                                  # Enable (set to 0) to drop literal-zero mu* params.
  # auto_drop_protect: ["cn2"]

  # Optional: drop parameters manually (combined with auto_drop; strict — typos error)
  # drop: ["revap_min", "flo_min"]

  # Optional: override min/max of an inherited (or extra) parameter
  # override_ranges:
  #   cn2:   { min: -40, max: 25 }

# --- Parameter mapping ---
# 14 inherited from Iteration 2 + 4 routing extras = 18 parameters in Iteration 3
param_map:
  cn2: "cn2::cn2.hru | change = pctchg"
  awc: "awc::awc.sol | change = pctchg"
  esco: "esco::esco.hru | change = absval"
  epco: "epco::epco.hru | change = absval"
  perco: "perco::perco.hru | change = absval"
  canmx: "canmx::canmx.hru | change = absval"
  latq_co: "latq_co::latq_co.hru | change = absval"
  petco: "petco::petco.hru | change = absval"
  revap_co: "revap_co::revap_co.aqu | change = absval"
  cn3_swf: "cn3_swf::cn3_swf.hru | change = absval"
  flo_min: "flo_min::flo_min.aqu | change = absval"
  bf_max: "bf_max::bf_max.aqu | change = absval"
  revap_min: "revap_min::revap_min.aqu | change = absval"
  alpha_bf: "alpha::alpha.aqu | change = absval"
  surlag: "surlag::surlag.bsn | change = absval"
  lattime: "lat_ttime::lat_ttime.hru | change = absval"
  chn: "chn::chn.rte | change = absval"
  ovn: "ovn::ovn.hru | change = pctchg"

# --- NO extra_params block ---
# ITER3's inherited_ranges already contains all 18 parameters (the 4 routing
# extras — surlag, lattime, chn, ovn — were added in iteration3.yaml at MORRIS3 and
# now live in ITER3's narrowed ranges). Adding them again here would be a
# no-op anyway (build_param_info filters duplicates), but the explicit
# absence makes the lineage clearer:
#   MORRIS3 introduces extras → ITER3 narrows them → ITER4 inherits all 18.

# --- Check parameter range ---
check_range:
  enabled: false
