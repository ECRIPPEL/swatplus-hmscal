# ==============================================================================
# ITERATION 2 CONFIG — monthly streamflow, plus the RC and BFI proxy criteria
# ==============================================================================

iteration: 2
script_version: "iteration2"

# --- Paths and execution (PRODUCTION — Cap 2 1980s window) ---
project_path: "C:/path/to/swatplus_project"   # <-- EDIT: SWAT+ project dir holding TxtInOut/
start_date: "1976-01-01"          # PRODUCTION
end_date: "1989-12-31"            # PRODUCTION
warmup: 4                         # PRODUCTION
threads: 20
seed: 123
channel_exutorio: 33

# --- Morris screening settings (PRODUCTION) ---
morris:
  tag_prefix: "MORRIS2"            # output folder pattern: MORRIS2_v<N>
  m_traj: 15                    # PRODUCTION
  delta: 0.20

# --- Calibration settings (PRODUCTION) ---
# Acceptance architecture:
#   satisfactory_run = (NSE_mon  >= threshold_nse)         AND
#                      (KGE_mon  >= threshold_kge)         AND
#                      (|PBIAS_mon| <= threshold_abs_pbias) AND
#                      (obj_rc      <= threshold_obj_rc)    AND
#                      (obj_bfi_mdae <= threshold_obj_bfi)
# Adds RC + BFI multi-site as persistent constraints alongside the monthly
# streamflow filter, so the cascade does not lose the Iteration 1 water-balance closure.
cal:
  tag_prefix: "ITER2"            # output folder pattern: ITER2_v<N>
  n_simulations: 250            # PRODUCTION
  type: "hard"
  inheritance_source: "satisfactory"  # PRODUCTION: narrow on accepted runs only
  start_date: "1976-01-01"          # PRODUCTION
  end_date: "1989-12-31"            # PRODUCTION
  warmup: 4                         # PRODUCTION

  # streamflow thresholds (PRODUCTION, monthly)
  threshold_nse: 0.70           # PRODUCTION
  threshold_kge: 0.70           # PRODUCTION
  threshold_abs_pbias: 10       # PRODUCTION

  # RC + BFI predicates
  rc_target:           0.51853  # observed Q_total / P (1980-1989 at Iraí outlet)
  threshold_obj_rc:    0.10     # |RC_obs - RC_sim| <= 0.10
  threshold_obj_bfi:   0.10     # median(|BFI_obs - BFI_sim|) <= 0.10

# --- BFI multisite targets (per-gauge BFI_obs, a, BFImax via Collischonn & Fan q90/q50) ---
bfi_targets_csv: "bfi_targets.csv"

# BFI runtime controls (PRODUCTION)
bfi:
  sim_source:       "swat_internal_bf"  # SWAT+ internal aquifer partition (filter source)
  multi_day_output: "vazao_multi_day"
  period_start:     "1980-01-01"
  period_end:       "1989-12-31"        # PRODUCTION; Eckhardt branch only
  min_days:         365                 # PRODUCTION; Eckhardt branch only
  eps:              0.05

# --- Observed data ---
obs_files:
  monthly: "obs_flow_mon.csv"
  daily: "obs_flow_daily.csv"
obs_start_date: "1980-01-01"

# --- SWAT+ outputs for Morris screening ---
# vazao_multi_day captures daily Q at all 9 BFI gauges (Eckhardt input);
# basin_wb + basin_aqu give P / wateryld / baseflow for RC.
morris_outputs:
  vazao_exutorio:
    file: "channel_sdmorph_mon"
    variable: "flo_out"
    unit: 33
  vazao_multi_day:
    file: "channel_sdmorph_day"
    variable: "flo_out"
    unit: [5, 19, 33, 35, 42, 73, 79, 114, 136, 146, 194]   # 9 BFI + 33 (Iraí outlet) + 35 (Foz Chapecó, ONS) for daily Q capture
  precip:
    file: "basin_wb_aa"
    variable: "precip"
    unit: 1
  et:
    file: "basin_wb_aa"
    variable: "et"
    unit: 1
  wateryld:
    file: "basin_wb_aa"
    variable: "wateryld"
    unit: 1
  baseflow:
    file: "basin_aqu_aa"
    variable: "flo_cha"
    unit: 1

# --- SWAT+ outputs for calibration ---
# Daily multi-channel Q + basin WB + baseflow components retained for the
# RC + BFI multi-site filter intent (logic built in user's separate code).
cal_outputs:
  vazao_exutorio_mon:
    file: "channel_sdmorph_mon"
    variable: "flo_out"
    unit: 33
  vazao_exutorio_day:
    file: "channel_sdmorph_day"
    variable: "flo_out"
    unit: 33
  vazao_multi_day:                  # daily Q at ALL selected gauges (Eckhardt input)
    file: "channel_sdmorph_day"
    variable: "flo_out"
    unit: [5, 19, 33, 35, 42, 73, 79, 114, 136, 146, 194]   # 9 BFI + 33 (Iraí outlet) + 35 (Foz Chapecó, ONS) for daily Q capture
  # channel-routed RC reads cha_aa_flo_out_<channel_exutorio> from
  # extra_outputs.channels (channel_sd_aa). channel_sdmorph_aa.flo_out_mm
  # is not exposed by SWATrunR's output-schema map, so we derive Q at the
  # outlet from m³/s and aquifer.con upstream-area topology.
  precip:
    file: "basin_wb_aa"
    variable: "precip"
    unit: 1
  et:
    file: "basin_wb_aa"
    variable: "et"
    unit: 1
  wateryld:
    file: "basin_wb_aa"
    variable: "wateryld"
    unit: 1
  baseflow:
    file: "basin_aqu_aa"
    variable: "flo_cha"
    unit: 1

# ------------------------------------------------------------------------------
# extra_outputs (OPTIONAL) — bulk retention for per-channel + per-aquifer
# diagnostics. Same intent as Iteration 1: BFI multi-site post-hoc check.
# ------------------------------------------------------------------------------
extra_outputs:
  enabled: true

  channels:
    enabled: true
    units: [5, 19, 33, 35, 42, 73, 79, 114, 136, 146, 194]   # 9 BFI + 33 + 35
    vars: ["flo_in", "flo_out", "evap", "seep"]    # H_diss canonical set

  aquifer:
    enabled: true
    n_aqu: 47
    aqu_vars: ["flo", "rchrg", "seep", "revap", "flo_cha"]

  lsu:
    enabled: false
  hru:
    enabled: false

# --- Morris screening observed target ---
morris_targets:
  rc: 0.51853                  # observed Q_total / P (1980-1989 at Iraí outlet)

# --- Morris screening metrics to compute EE ---
# NSE/KGE/PBIAS at monthly scale + obj_rc + obj_bfi_mdae;
# obj_total = err_nse + err_kge + err_pbias + obj_rc + obj_bfi_mdae
morris_metrics:
  - "NSE_mon"
  - "KGE_mon"
  - "PBIAS_mon"
  - "obj_rc"
  - "obj_bfi_mdae"
  - "obj_total"

# --- Temporal scale ---
temporal_scale: "monthly"
metric_suffix: "_mon"

# --- Inherited ranges (auto-discovers inherited_ranges_<from>_v<N>.csv) ---
inherit:
  from: "ITER1"                  # tag prefix of the source iteration (no _vN)

  # AUTO-DROP by Morris sensitivity: drops params with mu*(obj_total) <= threshold.
  # Filters at CAL stage — morris_screening_<TAG>.tif still shows the full ranking
  # (the figure is the evidence justifying the drop, kept for reproducibility audit).
  #   - 0      : drop only literal-zero mu* (catches silent fails / SWAT+ init bugs)
  #   - 0.001  : also drop physically irrelevant params (more aggressive)
  #   - omitted/NULL : disabled (default; preserves all inherited params)
  # auto_drop_threshold: 0        # PRODUCTION default = disabled.
                                  # Enable (set to 0) to drop literal-zero mu* params.
  # auto_drop_protect: ["cn2"]   # optional: shorts that must NEVER be auto-dropped

  # Optional: drop parameters manually (combined with auto_drop; strict — typos error)
  # drop: ["revap_min", "flo_min"]

  # Optional: override min/max of an inherited (or extra) parameter
  # override_ranges:
  #   cn2:   { min: -40, max: 25 }
  #   petco: { min: 0.85, max: 1.15 }

# --- Parameter mapping (short -> SWATrunR notation) ---
# 14 parameters inherited from Iteration 1 (10 hydrology + 4 aquifer including alpha_bf)
param_map:
  cn2: "cn2::cn2.hru | change = pctchg"
  awc: "awc::awc.sol | change = pctchg"
  esco: "esco::esco.hru | change = absval"
  epco: "epco::epco.hru | change = absval"
  perco: "perco::perco.hru | change = absval"
  canmx: "canmx::canmx.hru | change = absval"
  latq_co: "latq_co::latq_co.hru | change = absval"
  petco: "petco::petco.hru | change = absval"
  revap_co: "revap_co::revap_co.aqu | change = absval"
  cn3_swf: "cn3_swf::cn3_swf.hru | change = absval"
  flo_min: "flo_min::flo_min.aqu | change = absval"
  bf_max: "bf_max::bf_max.aqu | change = absval"
  revap_min: "revap_min::revap_min.aqu | change = absval"
  alpha_bf: "alpha::alpha.aqu | change = absval"

# --- Check parameter range ---
check_range:
  enabled: false
